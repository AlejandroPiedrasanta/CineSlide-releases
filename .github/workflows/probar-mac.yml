name: Probar CineSlide en Mac

# Descarga el instalador del Release, lo INSTALA en un Mac real de GitHub (Apple Silicon e Intel) y comprueba:
# la app y su icono, Python/PySide6/ffmpeg, que CREA un video (horizontal y vertical, con intro y música) que la Mac abre con
# AVFoundation como QuickTime (todos los cuadros, el audio y el color), y que la actualización automática encuentra y
# verifica la versión publicada y muestra el aviso "Actualización disponible". (9.66) Y la actualización REAL: la versión
# anterior se actualiza sola al cerrar, muestra las Novedades y baja la música. Los videos quedan en "Artifacts" de la ejecución.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión a probar (vacío = la última)"
        required: false
  release:
    types: [published]

jobs:
  mac:
    name: Mac ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, nombre: Silicon, arq: arm64 }      # macos-14 retirado por GitHub el 2026-11-02
          - { os: macos-15-intel, nombre: Intel, arq: x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55          # la instalación tarda ~17 min en Intel; el video, unos minutos más
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Descargar el instalador
        run: |
          mkdir -p work && cd work
          bajar() {   # $1 = tag (vacío = el último): el DMG (9.58+) o, en Releases viejos, el .zip con el .command
            gh release download $1 --repo "$GITHUB_REPOSITORY" --pattern "*Mac_${{ matrix.nombre }}.dmg" 2>/dev/null ||
              gh release download $1 --repo "$GITHUB_REPOSITORY" --pattern "*Mac_${{ matrix.nombre }}.zip" 2>/dev/null
          }
          if ! bajar $TAG; then
            # (9.56) Release con solo CineSlide.py (sin instaladores): el instalador del último Release que lo tenga + este CineSlide.py
            gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern CineSlide.py --output CineSlide_release.py
            for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
              if bajar "$t"; then
                echo "Instalador de $t + CineSlide.py de ${TAG:-el último Release}"; break
              fi
            done
          fi
          ls -la
      - name: Instalar (CINESLIDE_CI=1, sin ventanas)
        run: |
          cd work
          if ls *.dmg >/dev/null 2>&1; then                        # (9.58) DMG
            mnt=$(hdiutil attach -nobrowse -readonly *.dmg | grep -o '/Volumes/.*$' | head -1)
            ls -la "$mnt"
            RES="$mnt/Instalar CineSlide.app/Contents/Resources"   # la app "Instalar CineSlide" con su paquete
            CINESLIDE_CI=1 CINESLIDE_PAQUETE="$RES/paquete" bash "$RES/instalar_mac.sh"   # (9.61) deja CineSlide.app en /Applications
            hdiutil detach "$mnt"
          else
            unzip -q Instalar_CineSlide_v*_Mac_${{ matrix.nombre }}.zip
            CINESLIDE_CI=1 bash "$(ls -d CineSlide*/ | head -1)Instalar CineSlide.command"
          fi
      - name: Poner el CineSlide.py del Release (si vino sin instaladores)
        run: |
          if [ -f work/CineSlide_release.py ]; then
            cp work/CineSlide_release.py "$HOME/Library/Application Support/CineSlide/CineSlide.py"
            grep -m1 '^VERSION_MOTOR' "$HOME/Library/Application Support/CineSlide/CineSlide.py"
          else
            echo "El Release trae su instalador de Mac: se prueba tal cual."
          fi
      - name: Comprobar app, icono, Python, PySide6 y ffmpeg
        run: |
          DIR="$HOME/Library/Application Support/CineSlide"
          APP=$(cat "$DIR/app.txt" 2>/dev/null); [ -d "$APP" ] || APP="$HOME/Applications/CineSlide.app"   # (9.61) la de Aplicaciones
          echo "Versión instalada: $(cat "$DIR/version.txt") · app: $APP"
          test -f "$DIR/CineSlide.py" && test -d "$APP" && test -x "$APP/Contents/MacOS/CineSlide"
          if [ "$APP" = "/Applications/CineSlide.app" ]; then
            test ! -e "$HOME/Applications/CineSlide.app" && echo "sin el lanzador viejo de ~/Applications"
            "$APP/Contents/MacOS/CineSlide" --manifiesto && echo "ya instalado: la app entra directo a CineSlide"
          fi
          plutil -lint "$APP/Contents/Info.plist"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleIconFile|CFBundleVersion"
          ICNS="$APP/Contents/Resources/CineSlide.icns"
          test -s "$ICNS"
          mkdir -p "$RUNNER_TEMP/ic" && iconutil -c iconset "$ICNS" -o "$RUNNER_TEMP/ic/CineSlide.iconset"
          ls "$RUNNER_TEMP/ic/CineSlide.iconset"
          test "$(ls "$RUNNER_TEMP/ic/CineSlide.iconset" | wc -l)" -ge 8      # el icono trae sus tamaños (16 a 1024 px)
          sips -g pixelWidth "$RUNNER_TEMP/ic/CineSlide.iconset/icon_512x512@2x.png" | grep 1024
          codesign -v "$APP" && echo "firma de la app OK"
          file "$DIR/python/bin/python3" "$DIR/ffmpeg/bin/ffmpeg"
          file "$DIR/python/bin/python3" | grep -q "${{ matrix.arq }}"
          QT_QPA_PLATFORM=offscreen "$DIR/python/bin/python3" -c "from PySide6 import QtCore, QtWidgets; print('PySide6 / Qt', QtCore.qVersion())"
          "$DIR/ffmpeg/bin/ffmpeg" -hide_banner -version | head -1
          test ! -f "$HOME/Library/Application Support/Blackmagic Design/DaVinci Resolve/Fusion/Scripts/Utility/CineSlide.py"   # (9.30) sin lanzador de Resolve
      - name: Crear un video y abrirlo con AVFoundation (como QuickTime)
        run: |
          DIR="$HOME/Library/Application Support/CineSlide"
          xcrun swiftc -swift-version 5 -O verificar_av.swift -o "$RUNNER_TEMP/verificar_av"
          QT_QPA_PLATFORM=offscreen "$DIR/python/bin/python3" -u probar_video_mac.py "$DIR" "$RUNNER_TEMP/videos" "$RUNNER_TEMP/verificar_av"
      - name: Guardar los videos de prueba (para verlos en una Mac o un iPhone)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: videos-mac-${{ matrix.nombre }}
          path: ${{ runner.temp }}/videos/*.mp4
          if-no-files-found: ignore
          retention-days: 14
      - name: Actualización automática (descarga real + aviso de versión nueva)
        run: |
          DIR="$HOME/Library/Application Support/CineSlide"
          QT_QPA_PLATFORM=offscreen "$DIR/python/bin/python3" -u probar_actualizacion.py "$DIR"
      - name: Actualización REAL (la versión anterior se actualiza sola al cerrar; luego Novedades y música)
        run: |
          # (9.66) como un usuario: se instala el CineSlide.py de la versión anterior, se abre, encuentra la nueva, la baja,
          # se cierra (la Mac la instala sola al cerrar) y al volver a abrir muestra las Novedades y baja la música incluida.
          DIR="$HOME/Library/Application Support/CineSlide"
          QT_QPA_PLATFORM=offscreen "$DIR/python/bin/python3" -u probar_actualizacion_real.py "$DIR"
      - name: Registros
        if: always()
        run: |
          cat "$HOME/Library/Application Support/CineSlide/datos/logs/"instalador_mac_*.log 2>/dev/null | tail -80 || true
          ls -t "$HOME/Library/Application Support/CineSlide/datos/logs/"*.log 2>/dev/null | grep -v instalador_mac_ | head -2 | while IFS= read -r f; do
            echo "== $f"; tail -60 "$f"
          done || true
