name: Capturas del instalador en Mac

# A mano: baja el DMG del instalador a ~/Downloads de un Mac real de GitHub y lo usa como el cliente (lo abre, se ve su ventana,
# doble clic en "Instalar CineSlide": la ventana del instalador, sin Terminal; (9.61) al terminar deja CineSlide en Aplicaciones,
# lo abre, se cierra y expulsa el DMG; luego se abre CineSlide desde Aplicaciones, que debe entrar directo) y saca capturas de
# pantalla completas en cada paso. Las capturas quedan en "Artifacts" de la ejecución.
#   gh workflow run capturas-mac.yml -R AlejandroPiedrasanta/CineSlide-releases -f tag=v9.58 -f mac=Silicon
#   gh workflow run capturas-mac.yml -R AlejandroPiedrasanta/CineSlide-releases -f borrador=construir-dmg      (sin publicar)
# No reproduce el aviso de Gatekeeper: lo que baja gh no lleva la marca de cuarentena del navegador.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión (vacío = la última)"
        required: false
      borrador:
        description: "Borrador de Release con el DMG (opcional: para probar sin publicar)"
        required: false
      mac:
        description: "Tipo de Mac"
        type: choice
        options: [Silicon, Intel]
        default: Silicon

permissions:
  contents: write      # solo para poder leer los borradores de Release (no publica nada)

jobs:
  capturas:
    name: Capturas Mac ${{ inputs.mac }}
    runs-on: ${{ inputs.mac == 'Intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      BORRADOR: ${{ inputs.borrador }}
    steps:
      - name: Descargar el DMG en Descargas (como el navegador)
        run: |
          mkdir -p "$RUNNER_TEMP/capturas"
          cd "$HOME/Downloads"
          if [ -n "$BORRADOR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
              --jq ".[] | select(.draft and .tag_name == \"$BORRADOR\") | .assets[] | select(.name | endswith(\"Mac_${{ inputs.mac }}.dmg\")) | \"\(.url) \(.name)\"" | head -1 > lista.txt
            read -r url nombre < lista.txt || true
            test -n "$url" || { echo "El borrador '$BORRADOR' no tiene el DMG de Mac ${{ inputs.mac }}"; exit 1; }
            gh api -H "Accept: application/octet-stream" "$url" > "$nombre"
            rm -f lista.txt
          else
            gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern "*Mac_${{ inputs.mac }}.dmg"
          fi
          ls -la
          system_profiler SPDisplaysDataType | grep -iE "resolution|display type" || true
      - name: Abrir el DMG, instalar con la app y capturar cada paso
        run: |
          OUT="$RUNNER_TEMP/capturas"; n=0
          foto() { n=$((n+1)); f=$(printf "%s/%02d_%s.png" "$OUT" "$n" "$1"); if screencapture -x "$f"; then echo "captura: $(basename "$f")"; else echo "SIN CAPTURA: $1"; fi; }
          LOGS="$HOME/Library/Application Support/CineSlide/datos/logs"
          DMG="$(ls "$HOME/Downloads"/*.dmg | head -1)"
          open "$HOME/Downloads"; sleep 4; foto descargas
          open "$DMG"                                              # = doble clic en el DMG
          VOL=""
          for i in $(seq 1 60); do
            VOL=$(ls -d /Volumes/CineSlide* 2>/dev/null | head -1)
            [ -n "$VOL" ] && break; sleep 1
          done
          test -n "$VOL" || { foto dmg_no_monto; exit 1; }
          sleep 3; open "$VOL"; sleep 4; foto ventana_del_dmg
          APPX="$VOL/Instalar CineSlide.app"
          open "$APPX"                                             # = doble clic en "Instalar CineSlide"
          sleep 3; foto app_abriendo
          pasos=0; t=0; log=""; ultima=0
          while [ $t -lt 2400 ]; do
            sleep 2; t=$((t+2))
            [ -z "$log" ] && log=$(ls -t "$LOGS"/instalador_mac_*.log 2>/dev/null | head -1)
            [ -z "$log" ] && continue
            p=$(grep -c "▸" "$log" 2>/dev/null) || true; p=${p:-0}
            if [ "$p" != "$pasos" ]; then pasos=$p; sleep 1; t=$((t+1)); foto "paso_$p"; ultima=$t; fi
            if [ $((t - ultima)) -ge 40 ]; then foto "progreso_${t}s"; ultima=$t; fi
            if grep -qE "quedó instalado|✗" "$log"; then break; fi
          done
          sleep 1; foto instalador_listo
          sleep 3; foto instalador_cuenta_atras
          echo "--- registro del instalador"; sed 's/\x1b\[[0-9;]*m//g' "$log" | tail -45
          for s in 6 10 15; do sleep $s; foto cineslide_abierto; done
          pgrep -fl "instalador_ventana" && echo "AVISO: la ventana del instalador sigue abierta" || echo "la ventana del instalador se cerró sola"
          pgrep -fl "Terminal" && echo "AVISO: hay una Terminal abierta" || echo "sin Terminal"
          echo "app.txt: $(cat "$HOME/Library/Application Support/CineSlide/app.txt" 2>/dev/null)"
          test -e "$HOME/Applications/CineSlide.app" && echo "AVISO: quedó ~/Applications/CineSlide.app" || echo "sin lanzador en ~/Applications"
          ls -d /Volumes/CineSlide* 2>/dev/null && echo "AVISO: el DMG sigue montado" || echo "el DMG se expulsó solo"
          open /Applications; sleep 4; foto cineslide_en_aplicaciones
          # (9.61) segunda vez, desde Aplicaciones: CineSlide directo (sin el instalador)
          pkill -f "python3 -m CineSlide" >/dev/null 2>&1 || true; pkill -f "CineSlide/CineSlide.py" >/dev/null 2>&1 || true; sleep 4
          open "$(cat "$HOME/Library/Application Support/CineSlide/app.txt")"; sleep 14; foto segunda_vez
          pgrep -fl "instalador_ventana" && echo "AVISO: la segunda vez abrió el instalador" || echo "la segunda vez fue directo a CineSlide"
          pgrep -fl "python3 -m CineSlide" || pgrep -fl "CineSlide.py" || echo "AVISO: CineSlide no está abierto"
      - name: Guardar las capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-instalador-mac-${{ inputs.mac }}
          path: ${{ runner.temp }}/capturas/*.png
          if-no-files-found: warn
          retention-days: 30
