name: Capturas del instalador en Mac

# A mano: descarga el instalador del Release en ~/Downloads de un Mac real de GitHub, lo abre como lo haría el cliente
# (Finder, LEEME, doble clic en "Instalar CineSlide.command" -> Terminal, SIN CINESLIDE_CI) y saca capturas de pantalla
# completas en cada paso y de CineSlide al abrirse solo al final. Las capturas quedan en "Artifacts" de la ejecución.
#   gh workflow run capturas-mac.yml -R AlejandroPiedrasanta/CineSlide-releases -f tag=v9.57 -f mac=Silicon
# No reproduce el aviso de Gatekeeper: lo que baja gh no lleva la marca de cuarentena del navegador.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versión (vacío = la última)"
        required: false
      mac:
        description: "Tipo de Mac"
        type: choice
        options: [Silicon, Intel]
        default: Silicon

jobs:
  capturas:
    name: Capturas Mac ${{ inputs.mac }}
    runs-on: ${{ inputs.mac == 'Intel' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      OUT: ${{ runner.temp }}/capturas
    steps:
      - name: Descargar el instalador en Descargas (como el navegador)
        run: |
          mkdir -p "$OUT"
          cd "$HOME/Downloads"
          gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern "*Mac_${{ inputs.mac }}.zip"
          ditto -x -k Instalar_CineSlide_v*_Mac_${{ inputs.mac }}.zip .      # como la Utilidad de Archivo de Finder
          ls -la . CineSlide*/
          system_profiler SPDisplaysDataType | grep -iE "resolution|display type" || true
      - name: Abrir el instalador y capturar cada paso
        run: |
          n=0
          foto() { n=$((n+1)); f=$(printf "%s/%02d_%s.png" "$OUT" "$n" "$1"); if screencapture -x "$f"; then echo "captura: $(basename "$f")"; else echo "SIN CAPTURA: $1"; fi; }
          CARPETA="$(ls -d "$HOME/Downloads"/CineSlide*/ | head -1)"
          LOGS="$HOME/Library/Application Support/CineSlide/datos/logs"
          open "$HOME/Downloads"; sleep 4; foto descargas
          open "$CARPETA"; sleep 4; foto carpeta_del_instalador
          open -e "$CARPETA/LEEME.txt"; sleep 5; foto leeme
          killall TextEdit 2>/dev/null || true; sleep 1
          open "$CARPETA/Instalar CineSlide.command"          # = doble clic: se abre en Terminal
          sleep 5; foto terminal_inicio
          pasos=0; t=0; log=""
          while [ $t -lt 2400 ]; do
            sleep 3; t=$((t+3))
            [ -z "$log" ] && log=$(ls -t "$LOGS"/instalador_mac_*.log 2>/dev/null | head -1)
            if [ -z "$log" ]; then
              if [ $t -eq 60 ]; then foto sin_registro_60s; fi
              if [ $t -eq 90 ]; then                          # atascado (permiso de Descargas?): se abre desde la carpeta de usuario
                cp -R "$CARPETA" "$HOME/"; open "$HOME/$(basename "$CARPETA")/Instalar CineSlide.command"
              fi
              continue
            fi
            p=$(grep -c "▸" "$log" 2>/dev/null) || true; p=${p:-0}
            if [ "$p" != "$pasos" ]; then pasos=$p; sleep 2; t=$((t+2)); foto "paso_$p"; ultima=$t; fi
            if [ $((t - ${ultima:-0})) -ge 90 ]; then foto "progreso_${t}s"; ultima=$t; fi
            if grep -qE "quedó instalado|✗" "$log"; then break; fi
          done
          sleep 3; foto terminal_final
          echo "--- registro del instalador"; tail -40 "$log" | sed 's/\x1b\[[0-9;]*m//g'
          for s in 8 15 25; do sleep $s; foto "cineslide_abierto"; done
          open "$HOME/Applications"; sleep 4; foto app_en_aplicaciones
      - name: Guardar las capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-instalador-mac-${{ inputs.mac }}
          path: ${{ runner.temp }}/capturas/*.png
          if-no-files-found: warn
          retention-days: 30
