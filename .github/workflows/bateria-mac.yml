name: Batería de pruebas en Mac

# A mano (Actions > Batería de pruebas en Mac > Run workflow): instala el Release en 4 Macs reales (macOS 26 y 15, Apple Silicon e
# Intel), si se pide pone encima el CineSlide.py de un BORRADOR de Release (para probar una versión sin publicarla: los borradores
# no los ve nadie ni los baja la actualización automática) y corre bateria_mac.py: fotos de todo tipo (HEIC, EXIF, 48 MP, PNG de
# 16 bits, progresivas, dañadas...), videos de iPhone (HEVC girado, HDR), los 8 temas, 24/30/60 fps, 4K, H.264, "Los dos", intro,
# textos, música (una o varias), vertical, nombres raros y rutas largas, muchas fotos, una larga (rendimiento), la vista previa y
# la interfaz. Cada video se decodifica entero y se abre con AVFoundation (QuickTime). Informe en el resumen de la ejecución.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release a instalar (vacío = la última)"
        required: false
      borrador:
        description: "Tag de un borrador de Release con un CineSlide.py más nuevo (opcional)"
        required: false
      solo:
        description: "Escenarios separados por comas (vacío = todos)"
        required: false
      larga:
        description: "Fotos de la presentación larga"
        required: false
        default: "30"
      muchas:
        description: "Fotos del escenario 'muchas'"
        required: false
        default: "60"

permissions:
  contents: write      # solo para poder leer los borradores de Release (no publica nada)

jobs:
  mac:
    name: Batería ${{ matrix.nombre }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26, nombre: macOS26-Silicon, zip: Silicon }
          - { os: macos-26-intel, nombre: macOS26-Intel, zip: Intel }
          - { os: macos-15, nombre: macOS15-Silicon, zip: Silicon }
          - { os: macos-15-intel, nombre: macOS15-Intel, zip: Intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      BORRADOR: ${{ inputs.borrador }}
      SOLO: ${{ inputs.solo }}
    steps:
      - uses: actions/checkout@v7
      - name: Descargar e instalar el Release
        run: |
          sw_vers
          mkdir -p work && cd work
          bajar() {   # $1 = tag (vacío = el último): el DMG (9.58+) o, en Releases viejos, el .zip con el .command
            gh release download $1 --repo "$GITHUB_REPOSITORY" --pattern "*Mac_${{ matrix.zip }}.dmg" 2>/dev/null ||
              gh release download $1 --repo "$GITHUB_REPOSITORY" --pattern "*Mac_${{ matrix.zip }}.zip" 2>/dev/null
          }
          if ! bajar $TAG; then
            # (9.75) desde la 9.72 los Release no traen DMG de Intel (regla del usuario): el instalador del último Release que lo
            # tenga + el CineSlide.py de este Release (como probar-mac.yml). Antes las 2 Macs Intel fallaban aquí siempre.
            gh release download $TAG --repo "$GITHUB_REPOSITORY" --pattern CineSlide.py --output CineSlide_release.py
            for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName'); do
              if bajar "$t"; then
                echo "Instalador de $t + CineSlide.py de ${TAG:-el último Release}"; break
              fi
            done
          fi
          # (9.58) el DMG (la app "Instalar CineSlide" con su paquete) o, en Releases viejos, el .zip con el .command
          if ls *.dmg >/dev/null 2>&1; then
            mnt=$(hdiutil attach -nobrowse -readonly *.dmg | grep -o '/Volumes/.*$' | head -1)
            RES="$mnt/Instalar CineSlide.app/Contents/Resources"
            CINESLIDE_CI=1 CINESLIDE_PAQUETE="$RES/paquete" bash "$RES/instalar_mac.sh" > instalacion.log 2>&1 || { tail -60 instalacion.log; exit 1; }
            hdiutil detach "$mnt"
          else
            unzip -q Instalar_CineSlide_v*_Mac_${{ matrix.zip }}.zip
            CINESLIDE_CI=1 bash "$(ls -d CineSlide*/ | head -1)Instalar CineSlide.command" > instalacion.log 2>&1 || { tail -60 instalacion.log; exit 1; }
          fi
          tail -3 instalacion.log
          if [ -f CineSlide_release.py ]; then
            cp CineSlide_release.py "$HOME/Library/Application Support/CineSlide/CineSlide.py"
            grep -m1 '^VERSION_MOTOR' "$HOME/Library/Application Support/CineSlide/CineSlide.py"
          fi
      - name: Poner el CineSlide.py del borrador
        if: ${{ inputs.borrador != '' }}
        run: |
          DIR="$HOME/Library/Application Support/CineSlide"
          URL=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" --jq ".[] | select(.draft and .tag_name == \"$BORRADOR\") | .assets[] | select(.name == \"CineSlide.py\") | .url" | head -1)
          test -n "$URL" || { echo "No hay un borrador '$BORRADOR' con CineSlide.py"; exit 1; }
          gh api -H "Accept: application/octet-stream" "$URL" > "$RUNNER_TEMP/CineSlide.py"
          python3 -c "import ast, sys; ast.parse(open(sys.argv[1], encoding='utf-8').read())" "$RUNNER_TEMP/CineSlide.py"
          cp "$RUNNER_TEMP/CineSlide.py" "$DIR/CineSlide.py"
          grep -m1 '^VERSION_MOTOR' "$DIR/CineSlide.py"
      - name: Batería
        run: |
          DIR="$HOME/Library/Application Support/CineSlide"
          xcrun swiftc -swift-version 5 -O verificar_av.swift -o "$RUNNER_TEMP/verificar_av"
          EXTRA=()
          [ -n "$SOLO" ] && EXTRA+=("--solo=$SOLO")
          QT_QPA_PLATFORM=offscreen "$DIR/python/bin/python3" -u bateria_mac.py "$DIR" "$RUNNER_TEMP/bateria" "$RUNNER_TEMP/verificar_av" \
            --larga=${{ inputs.larga || '30' }} --muchas=${{ inputs.muchas || '60' }} --precalentar "${EXTRA[@]}"
      - name: Resumen
        if: always()
        run: cat "$RUNNER_TEMP/bateria/informe.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Sin informe" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el informe, la imagen de la interfaz y los videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bateria-${{ matrix.nombre }}
          path: |
            ${{ runner.temp }}/bateria/informe.*
            ${{ runner.temp }}/bateria/*.png
            ${{ runner.temp }}/bateria/*/*.mp4
          if-no-files-found: warn
          retention-days: 7
      - name: Registros
        if: always()
        run: |
          ls -t "$HOME/Library/Application Support/CineSlide/datos/logs/"*.log 2>/dev/null | head -3 | while IFS= read -r f; do
            echo "== $f"; tail -80 "$f"
          done || true
